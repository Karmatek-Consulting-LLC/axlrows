# Build, sign, and publish AXLRows installers for Windows, macOS, and Linux.
#
# Windows signing uses Azure Trusted Signing via GitHub OIDC — no stored
# secret (docs/CODE_SIGNING.md). Tauri's documented signCommand route needs an
# AZURE_CLIENT_SECRET, so instead the exe is built unbundled, signed, and THEN
# bundled (tauri build --no-bundle → sign → tauri bundle → sign installers) so
# the binary inside the MSI/NSIS installer carries a signature too.
# macOS signing + notarization uses a Developer ID certificate from secrets;
# Tauri's bundler handles both when the APPLE_* env vars are set.
#
# Signing self-skips when credentials are missing and the release is marked
# UNSIGNED — usable for internal testing, never for distribution (SmartScreen
# and Gatekeeper will flag it).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # GitHub OIDC federation for azure/login (no stored secret)

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match tauri.conf.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG" != "$CONF" ]; then
            echo "::error::Tag v$TAG does not match tauri.conf.json version $CONF — bump the version before tagging."
            exit 1
          fi

  windows:
    needs: preflight
    runs-on: windows-latest
    # Protected environment so not every push can sign; restrict it to v* tags
    # in repo Settings → Environments → release → Deployment branches and tags.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build binary (bundling deferred until the exe is signed)
        run: npm run tauri build -- --no-bundle

      - name: Warn — Windows signing not configured
        if: vars.AZURE_CLIENT_ID == ''
        shell: bash
        run: |
          echo "::warning::AZURE_CLIENT_ID is unset — Windows artifacts will be UNSIGNED (internal testing only). See docs/CODE_SIGNING.md."

      - uses: azure/login@v2
        if: vars.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Sign the exe BEFORE bundling so the binary embedded in the MSI and
      # NSIS installers is signed.
      - name: Sign axlrows.exe
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERT_PROFILE }}
          files-folder: src-tauri/target/release
          files-folder-filter: exe

      - name: Bundle installers
        run: npm run tauri bundle

      - name: Sign installers (.msi + NSIS setup exe)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERT_PROFILE }}
          files-folder: src-tauri/target/release/bundle
          files-folder-filter: msi,exe
          files-folder-recurse: true

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    needs: preflight
    runs-on: macos-latest
    environment: release
    env:
      # Secrets can't be used in `if:` directly; this indirection can.
      APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Warn — macOS signing not configured
        if: env.APPLE_SIGNING != 'true'
        run: |
          echo "::warning::APPLE_CERTIFICATE secret is unset — the .dmg will be UNSIGNED and un-notarized (internal testing only). See docs/CODE_SIGNING.md."

      - name: Import Developer ID certificate
        if: env.APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Ephemeral keychain password — the keychain dies with the runner.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # No auto-lock: the default 300 s timeout would lock the keychain
          # mid-build and fail codesign after the long Rust compile.
          security set-keychain-settings build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build, sign, and notarize universal .dmg
        if: env.APPLE_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Build universal .dmg (unsigned)
        if: env.APPLE_SIGNING != 'true'
        run: npm run tauri build -- --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential curl file patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ${{ vars.AZURE_CLIENT_ID == '' && '⚠️ **Windows installers are UNSIGNED** — internal testing only (docs/CODE_SIGNING.md).' || '' }}
            ${{ secrets.APPLE_CERTIFICATE == '' && '⚠️ **macOS dmg is UNSIGNED and un-notarized** — internal testing only (docs/CODE_SIGNING.md).' || '' }}
          files: dist/**

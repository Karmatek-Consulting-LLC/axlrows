<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- AXLRows logo: SQL in (prompt line), rows out (result bars). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="row" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>

  <!-- prompt line: chevron + typed SQL -->
  <path d="M 330 232 L 438 340 L 330 448" fill="none" stroke="#e2e8f0"
        stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="506" y="309" width="196" height="62" rx="31" fill="#e2e8f0" opacity="0.92"/>

  <!-- result rows -->
  <rect x="306" y="508" width="412" height="78" rx="39" fill="url(#row)"/>
  <rect x="306" y="620" width="330" height="78" rx="39" fill="url(#row)" opacity="0.78"/>
  <rect x="306" y="732" width="248" height="78" rx="39" fill="url(#row)" opacity="0.56"/>
</svg>

# Builds the Windows installers and signs them through SignPath Foundation
# (free code signing for open source). See docs/SIGNING.md for the one-time
# SignPath setup this workflow depends on.
#
# Until the SIGNPATH_API_TOKEN secret is configured, the signing steps are
# skipped and the workflow still produces unsigned installers, so CI works
# before the SignPath application is approved.

name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: windows-latest
    permissions:
      contents: write # attach installers to the GitHub release on tag builds
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installers
        run: npm run tauri build

      - name: Stage unsigned installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe staging/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi staging/
          Get-ChildItem staging

      - name: Upload unsigned installers
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: axlrows-windows-unsigned
          path: staging/*

      # SignPath's artifact configuration must expect a zip-file root element,
      # because upload-artifact wraps the staged files in a ZIP.
      - name: Sign installers via SignPath
        id: signpath
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: axlrows
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed installers
        if: ${{ steps.signpath.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: axlrows-windows-signed
          path: signed/*

      # Falls back to the unsigned installers so tag builds still produce a
      # draft release before SignPath is configured.
      - name: Select release files
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          $dir = if (Test-Path signed) { 'signed' } else { 'staging' }
          "RELEASE_DIR=$dir" >> $env:GITHUB_ENV

      - name: Attach installers to GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: ${{ env.RELEASE_DIR }}/*
